[project]
name = "todo"
version = "0.1.0"
description = "ToDo bot"
requires-python = ">=3.13"
dependencies = [
    "django-cors-headers>=4.9.0",
    "django>=6.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.2",
    "adrf>=0.1.12",
    "asyncpg>=0.31.0",
    "daphne>=4.2.1",
    "drf-spectacular>=0.29.0",
    "django-unfold>=0.86.1",
    "twisted[http2,tls]>=25.5.0",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "pre-commit>=4.5.1",
    "djangorestframework-stubs>=3.16.8",
    "django-stubs>=5.2.9",
]

[tool.ruff]
target-version = "py313"
src = ["backend"]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
    "TCH",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"backend/core/settings/__init__.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["core", "todo", "auth_user"]
combine-as-imports = true
