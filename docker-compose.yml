services:
  backend:
    container_name: todo-backend
    build:
      dockerfile: Dockerfile
    env_file:
      .env
    command: sh -c "python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - todo-static:/backend/static

volumes:
  todo-static:
    external: true
    
networks:
  default:
    external: true
    name: todo-network
